; Crossplay keyboard and mouse bindings (Call of Duty, Default button layout)
W = LS-Up
S = LS-Down
A = LS-Left
D = LS-Right
Space = A
V = RS
Shift = LS
C = B
CTRL = B
R = X
E = X
F = X
1 = Y
MWheelUp = Y
MWheelDown = Y
LClick = RT
RClick = LT
MClick = RB
G = RB
Mouse4 = LB
4 = LB
2 = Left
3 = Right
5 = Up
6 = Down
Escape = Start
Enter = Start
Tab = Back

; arrow keys as the D-pad
Up = Up
Down = Down
Left = Left
Right = Right